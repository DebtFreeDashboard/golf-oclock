name: Fast alert poll

on:
  schedule:
    - cron: '*/5 9-23,0-3 * * *'
  workflow_dispatch:

# Shares a lane with the full poll so the two can never write seen.json at once.
concurrency:
  group: golf-poll
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  hot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # ── Poller state lives on the `state` branch, never on main ──────────
      # main then only changes when Kevin changes it, so a local clone is never
      # racing a bot that commits every few minutes — which is what repeatedly
      # ate uncommitted work in GitHub Desktop on 2026-09-12.
      # On the very first run `state` does not exist and main's copies seed it.
      - name: Restore poller state
        run: |
          set -e
          if git ls-remote --exit-code --heads origin state >/dev/null 2>&1; then
            git fetch --depth=1 origin state
            git checkout FETCH_HEAD -- data/teetimes.json data/seen.json
            git reset -q
            echo "State restored from the state branch."
          else
            echo "No state branch yet — seeding from the copies on main."
          fi

      - name: Poll only what you have alerts on
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_SERVER: ${{ secrets.NTFY_SERVER }}
        run: node src/index.js --hot

      - name: Save alert state
        run: |
          set -e
          git config user.name  "golf-oclock-bot"
          git config user.email "actions@users.noreply.github.com"
          # Both files are staged so the force-push carries the current tee time
          # data forward rather than reverting `state` to main's frozen copy.
          git add data/teetimes.json data/seen.json
          if git diff --staged --quiet; then
            echo "No change."
            exit 0
          fi
          git commit -m "fast poll $(date -u +'%H:%M UTC')"
          git push --force origin HEAD:state
