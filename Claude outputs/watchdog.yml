name: Watchdog

# Is the pipeline actually alive? Checks that tee time data is being written,
# and clears runs wedged in the queue.
#
# Runs half-hourly, offset from the pollers' minutes, across the polling window
# plus a little either side. Outside those hours stale data is expected, so
# there is nothing to report.
on:
  schedule:
    - cron: '13,43 10-23,0-3 * * *'
  workflow_dispatch:

# NOT `golf-poll`. This workflow must never queue behind the thing it watches —
# a watchdog stuck in the same jam cannot report the jam. Newest run wins;
# it only ever reads state, so cancelling an older one loses nothing.
concurrency:
  group: golf-watchdog
  cancel-in-progress: true

permissions:
  contents: read
  actions: write          # needed to cancel a stuck run

jobs:
  watchdog:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Check the pipeline is alive
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_SERVER: ${{ secrets.NTFY_SERVER }}
          STALE_MINUTES: '45'
          STUCK_MINUTES: '20'
        run: node src/watchdog.js
